          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - operator.ibm.com
          resources:
          - operandrequests
          - operandregistries
          - operandconfigs
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
